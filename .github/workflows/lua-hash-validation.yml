name: Validate Lua hash dictionaries
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify SV and ZA names
        run: python scripts/lua_hash.py verify
